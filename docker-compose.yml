services:
  web:
    build:
      context: ./ecommerce-admin
      dockerfile: app/Dockerfile.dev
    container_name: e-Commerce-App
    ports:
      - "3000:3000"
    env_file:
      - ./ecommerce-admin/app/.env.local
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # Add your external Supabase credentials here:
      
      # Add any additional environment variables below:
      # - DATABASE_URL=postgresql://...
      #Testing
    volumes:
      # Mount workspace directory for Hot Module Replacement (HMR)
      - ./ecommerce-admin/app:/ecommerce-admin/app
      # Prevent local host node_modules from overriding container node_modules
      - /ecommerce-admin/node_modules
      - /ecommerce-admin/.next
