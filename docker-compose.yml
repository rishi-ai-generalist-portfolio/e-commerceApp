services:
  web:
    build:
      context: .                           # Looks at workspace root e-commerceApp
      dockerfile: Dockerfile.dev
    container_name: e-Commerce-App
    ports:
      - "3000:3000"                       # Admin Port
      - "3001:3001"                       # Customer Port
    env_file:
      - ./.env.local                      # Reference path at root
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      # 1. Bind mount the host root directory (e-commerceApp) to the container working directory (/app)
      - .:/app
      
      # 2. Anonymous volumes targeting the /app container paths to protect isolated container dependencies
      - /app/node_modules
      - /app/ecommerce-admin/node_modules
      - /app/ecommerce-admin/.next
      - /app/ecommerce-customer/node_modules
      - /app/ecommerce-customer/.next
